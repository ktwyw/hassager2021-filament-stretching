[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hassager2021-filament-reproduction"
version = "1.2.0"
description = "Python reconstruction of Hassager, Wang & Huang (Physics of Fluids 33, 123108, 2021)"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = ["License :: OSI Approved :: MIT License"]
authors = [{name = "Yanwei Wang"}]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
]

[tool.setuptools]
packages = ["hassager2021"]
