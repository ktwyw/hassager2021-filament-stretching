name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            numpy: "numpy==1.26.*"
          - python: "3.12"
            numpy: "numpy>=2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "${{ matrix.numpy }}" "scipy>=1.11" "matplotlib>=3.8" pytest
      - run: python -m pytest -q
      - run: python reproduce_all.py --output ci_outputs --quality fast
